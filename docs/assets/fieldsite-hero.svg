<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FieldSite</title>
  <desc id="desc">Animated dark geometric banner representing private on-device field intelligence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05070B"/>
      <stop offset="0.52" stop-color="#07111F"/>
      <stop offset="1" stop-color="#020408"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(640 210) rotate(90) scale(220 520)">
      <stop stop-color="#153A67" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#153A67" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="28" fill="url(#glow)"/>
  <g opacity="0.22" stroke="#6B86A8" stroke-width="1">
    <path d="M80 105H1200"/><path d="M80 210H1200"/><path d="M80 315H1200"/>
    <path d="M220 46V374"/><path d="M430 46V374"/><path d="M640 46V374"/><path d="M850 46V374"/><path d="M1060 46V374"/>
  </g>
  <g transform="translate(640 210)">
    <circle r="106" stroke="#193B64" stroke-width="1.5" opacity="0.75"/>
    <circle r="72" stroke="#315D90" stroke-width="1.5" opacity="0.9"/>
    <circle r="35" fill="#0A1830" stroke="#6AA9F5" stroke-width="1.5"/>
    <rect x="-8" y="-8" width="16" height="16" rx="4" fill="#F6F8FB"/>
    <circle r="92" stroke="#74AFFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="42 536" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle r="125" stroke="#2E5F97" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="22 764" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#7FB8FF">
    <circle cx="405" cy="210" r="4"><animate attributeName="opacity" values="0.18;1;0.18" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="875" cy="210" r="4"><animate attributeName="opacity" values="1;0.18;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="80" r="4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="340" r="4"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" text-anchor="middle">
    <text x="640" y="195" fill="#F7F9FC" font-size="54" font-weight="700" letter-spacing="-2">FieldSite</text>
    <text x="640" y="244" fill="#9FB3CC" font-size="17" font-weight="500" letter-spacing="2.4">LOCAL-FIRST FIELD INTELLIGENCE</text>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8297B2">
    <text x="92" y="80">CAPTURE</text><text x="1110" y="80">ON-DEVICE</text>
    <text x="92" y="350">VALIDATE</text><text x="1090" y="350">RECONCILE</text>
  </g>
</svg>
