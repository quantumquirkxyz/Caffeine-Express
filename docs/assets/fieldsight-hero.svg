<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">FieldSight animated logo banner</title>
  <desc id="desc">Animated FieldSight logo and local-first intelligence banner based on the project identity.</desc>
  <style>
    .orbit { animation: orbit 12s linear infinite; transform-origin: 970px 210px; }
    .orbit-slow { animation: orbitReverse 18s linear infinite; transform-origin: 970px 210px; }
    .pixel-a { animation: floatA 3.8s ease-in-out infinite; }
    .pixel-b { animation: floatB 4.5s ease-in-out infinite; }
    .line-a { animation: draw 3.2s ease-in-out infinite alternate; stroke-dasharray: 220; stroke-dashoffset: 70; }
    .wordmark { animation: fadeUp 1.2s ease-out both; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes orbitReverse { to { transform: rotate(-360deg); } }
    @keyframes floatA { 0%, 100% { transform: translateY(0); opacity: .88; } 50% { transform: translateY(-8px); opacity: 1; } }
    @keyframes floatB { 0%, 100% { transform: translateY(0); opacity: .72; } 50% { transform: translateY(7px); opacity: 1; } }
    @keyframes draw { from { stroke-dashoffset: 180; opacity: .25; } to { stroke-dashoffset: 0; opacity: .78; } }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
  <defs>
    <linearGradient id="blue" x1="84" y1="292" x2="229" y2="104" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06396E"/>
      <stop offset="0.62" stop-color="#0B58B7"/>
      <stop offset="1" stop-color="#0D75FF"/>
    </linearGradient>
    <linearGradient id="ink" x1="120" y1="300" x2="230" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20272D"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(970 210) rotate(90) scale(174 260)">
      <stop stop-color="#EEF3FA"/>
      <stop offset="1" stop-color="#EEF3FA" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="40" y="70" width="1180" height="280" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B1524" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="30" fill="#FAFBFD"/>
  <path d="M0 0H1280V420H0V0Z" fill="url(#halo)"/>

  <g filter="url(#softShadow)">
    <g transform="translate(82 116) scale(1.55)">
      <path d="M14 52 L46 20 H97 V36 L82 51 H41 V80 L14 108 Z" fill="url(#blue)"/>
      <path d="M34 91 H80 L101 70 V58 H75 V69 H58 V80 H45 Z" fill="url(#ink)"/>
      <path d="M46 80 H74 V67 H50 V57 H100 V78 L82 98 H28 Z" fill="url(#ink)" opacity=".96"/>
      <rect class="pixel-a" x="50" y="60" width="18" height="18" rx="3" fill="url(#blue)"/>
      <rect class="pixel-b" x="76" y="46" width="15" height="15" rx="2.5" fill="url(#blue)"/>
      <rect class="pixel-a" x="92" y="30" width="11" height="11" rx="2" fill="url(#blue)"/>
    </g>

    <g class="wordmark" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      <text x="270" y="213" fill="#020407" font-size="70" font-weight="800" letter-spacing="-3.5">FieldSight</text>
      <path d="M86 288H154" stroke="#AAB3BE" stroke-width="2"/>
      <text x="175" y="295" fill="#8E98A6" font-size="17" font-weight="600" letter-spacing="8">LOCAL-FIRST INTELLIGENCE</text>
    </g>
  </g>

  <g transform="translate(970 210)">
    <circle r="142" fill="#F1F4F8" opacity=".42"/>
    <circle class="orbit" r="178" stroke="#AAB6C4" stroke-width="1.3" stroke-dasharray="3 9"/>
    <circle class="orbit-slow" r="126" stroke="#D7DDE5" stroke-width="1" stroke-dasharray="180 640"/>
    <rect x="46" y="-61" width="170" height="122" rx="18" fill="#FFFFFF" stroke="#CBD3DD" stroke-width="1.2"/>
    <rect x="72" y="-35" width="86" height="17" rx="8.5" fill="#7D858E"/>
    <rect x="72" y="-4" width="116" height="14" rx="7" fill="#E1E5EA"/>
    <rect x="72" y="26" width="91" height="14" rx="7" fill="#E8EBF0"/>
    <path class="line-a" d="M-210 -62 C-130 -62 -110 -62 -79 -28 S-22 -2 0 -2" stroke="#A6B0BD" stroke-width="1.4" fill="none"/>
    <path class="line-a" d="M-198 0 C-128 0 -111 2 -80 -20 S-20 0 0 0" stroke="#BAC2CC" stroke-width="1.4" fill="none"/>
    <path class="line-a" d="M-180 82 C-110 82 -111 28 -79 13 S-19 0 0 0" stroke="#A6B0BD" stroke-width="1.4" fill="none"/>
    <circle cx="0" cy="0" r="6" fill="#064789"/>
    <circle class="pixel-a" cx="154" cy="128" r="6" fill="#064789"/>
    <circle class="pixel-b" cx="-146" cy="-126" r="6" fill="#B8C0CA"/>
    <rect class="pixel-a" x="-230" y="-75" width="25" height="25" rx="3" fill="#064789"/>
    <rect class="pixel-b" x="-190" y="9" width="26" height="26" rx="3" fill="#FFFFFF" stroke="#064789"/>
    <rect class="pixel-a" x="-260" y="60" width="31" height="31" rx="4" fill="#064789"/>
    <rect class="pixel-b" x="-314" y="-108" width="14" height="14" rx="2" fill="#CBD1D8"/>
    <rect class="pixel-a" x="-280" y="-14" width="14" height="14" rx="2" fill="#C7CED7"/>
    <rect class="pixel-b" x="-190" y="105" width="14" height="14" rx="2" fill="#D9DEE5"/>
  </g>
</svg>
