name: repository-audit

on:
  push:
    branches: [hackathon-final-pass]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Full project verification
        run: npm run verify
      - name: Expo doctor
        run: npx expo-doctor
      - name: Dependency audit high or critical
        run: npm audit --audit-level=high
      - name: Scan first-party text for Spanish remnants
        shell: bash
        run: |
          set +e
          echo '=== Accented Spanish characters ==='
          git grep -nI -E '[áéíóúÁÉÍÓÚñÑ¿¡]' -- README.md CONTEXT.md JUDGING.md src docs scripts app.json package.json || true
          echo '=== Common Spanish terms ==='
          git grep -nI -E '\b(dicta|dictado|observación|observaciones|procesar|procesando|grabando|transcripción|ordenando|campo|equipo|equipos|sitio|cliente|siguiente|atrás|omitir|entrar|todavía|detectó|pudo|necesita|permiso|durante|segundo|datos|confiables|habla|dispositivo|móvil|requiere|hospitales|guardada|listo|cargando|error|revisa|escribe|voz|texto)\b' -- README.md CONTEXT.md JUDGING.md src docs scripts app.json package.json || true
          exit 0
      - name: Compile every Mermaid diagram
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          out = Path('/tmp/mermaid')
          out.mkdir(parents=True, exist_ok=True)
          count = 0
          for md in [p for p in Path('.').rglob('*.md') if '.git' not in p.parts and 'node_modules' not in p.parts]:
              text = md.read_text(encoding='utf-8')
              for i, match in enumerate(re.finditer(r'```mermaid\s*\n(.*?)```', text, flags=re.S), 1):
                  count += 1
                  target = out / f'{count:03d}.mmd'
                  target.write_text(match.group(1).strip() + '\n', encoding='utf-8')
                  print(f'{target}: {md} diagram {i}')
          if count == 0:
              raise SystemExit('No Mermaid diagrams found')
          print(f'Found {count} Mermaid diagrams')
          PY
          printf '{"executablePath":"/usr/bin/google-chrome","args":["--no-sandbox","--disable-setuid-sandbox"]}\n' > /tmp/puppeteer.json
          for f in /tmp/mermaid/*.mmd; do
            echo "Compiling $f"
            npx -y @mermaid-js/mermaid-cli@latest -p /tmp/puppeteer.json -i "$f" -o "$f.svg"
          done
      - name: Check tracked filenames and binary inventory
        shell: bash
        run: |
          echo '=== Tracked files ==='
          git ls-files
          echo '=== Binary/non-text likely challenge assets ==='
          git ls-files | grep -E '\.(xlsx|png|jpg|jpeg|gif|pdf|webp|ico)$' || true
