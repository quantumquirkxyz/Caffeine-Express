name: frontend-snapshot

on:
  push:
    branches: [hackathon-final-pass]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run export:web
      - name: Serve web export
        run: |
          python3 -m http.server 4173 -d dist > /tmp/fieldsight-http.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173 >/dev/null && exit 0; sleep 1; done
          cat /tmp/fieldsight-http.log
          exit 1
      - name: Capture desktop screenshot
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1100 --screenshot=frontend-desktop.png http://127.0.0.1:4173
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-snapshot
          path: frontend-desktop.png
