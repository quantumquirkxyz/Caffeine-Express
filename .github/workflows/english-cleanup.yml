name: english-cleanup

on:
  push:
    branches: [hackathon-final-pass]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hackathon-final-pass
      - name: Normalize first-party English text
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'JUDGING.md': {
                  'Dictar observación': 'Dictate observation',
              },
              'src/screens/InstalledBaseScreen.tsx': {
                  'años': 'years',
                  'Sin ubicación disponible': 'No location available',
                  'BASE INSTALADA': 'INSTALLED BASE',
                  '"Equipos"': '"Units"',
                  '"Modalidades"': '"Modalities"',
                  'Refina la vista de Installed equipment': 'Refine the Installed equipment view',
                  'Mostrar filtros': 'Show filters',
                  '"País"': '"Country"',
                  '"Cliente"': '"Client"',
                  '"Sede"': '"Site"',
                  '"Modalidad"': '"Modality"',
                  '"Marca"': '"Brand"',
                  '"Modelo"': '"Model"',
                  'Inventario de equipos': 'Equipment inventory',
                  'registros de Installed equipment': 'Installed equipment records',
                  'Equipo / Modelo': 'Equipment / Model',
                  'Estado': 'State',
                  'Evidencia y observaciones': 'Evidence and observations',
                  'Observaciones vinculadas': 'Linked observations',
                  'Cantidad ': 'Quantity ',
                  ' · Edad': ' · Age',
                  'Selecciona un equipo para revisar su evidencia.': 'Select equipment to review its evidence.',
              },
          }

          for filename, mapping in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for source, target in mapping.items():
                  text = text.replace(source, target)
              path.write_text(text, encoding='utf-8')

          for filename in [
              'CONTEXT.md', 'JUDGING.md', 'docs/proposal-solution.md', 'docs/architecture.md',
              'docs/qvac/README.md', 'docs/qvac/dictation.md', 'docs/qvac/extraction-contract.md',
              'docs/qvac/runtime-and-smoke.md', 'docs/research/frontend-design.md'
          ]:
              path = Path(filename)
              if path.exists():
                  path.write_text(path.read_text(encoding='utf-8').replace('FieldSight', 'FieldSite'), encoding='utf-8')
      - name: Remove Spanish organizer text extracts
        run: |
          rm -f docs/hackathon_rules/Reglas_Decentralized_AI_Hackathon.txt
          rm -f docs/hackathon_rules/TyC_Decentralized_AI_Hackathon.txt
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: make tracked product content English-only'
          git push origin HEAD:hackathon-final-pass
