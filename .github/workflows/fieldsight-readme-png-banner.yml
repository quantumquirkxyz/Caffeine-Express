name: fieldsight-readme-png-banner

on:
  push:
    branches: [hackathon-final-pass]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hackathon-final-pass
          fetch-depth: 0
      - name: Replace SVG hero with HTML banner and PNG logo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/assets
          python - <<'PY'
          from pathlib import Path
          import base64

          logo_b64 = ''''''
          Path('docs/assets/fieldsight-logo.png').write_bytes(base64.b64decode(logo_b64))

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = '<div align="center">\n  <img src="docs/assets/fieldsight-hero.svg" alt="Animated FieldSight logo banner" width="100%" />\n</div>\n\n# FieldSight'
          new = '''<div align="center">
  <table width="100%">
    <tr>
      <td width="45%" align="left">
        <img src="docs/assets/fieldsight-logo.png" alt="FieldSight logo" width="220" />
        <br />
        <sub><strong>LOCAL-FIRST INTELLIGENCE</strong></sub>
      </td>
      <td width="55%" align="center">
        <strong>Type / dictate → QVAC → validate → reconcile</strong><br />
        <sub>Private field intelligence with no cloud inference fallback.</sub>
      </td>
    </tr>
  </table>
</div>

# FieldSight'''
          if old not in text:
              raise SystemExit('Expected README hero block not found')
          readme.write_text(text.replace(old, new, 1), encoding='utf-8')

          hero = Path('docs/assets/fieldsight-hero.svg')
          if hero.exists():
              hero.unlink()
          workflow = Path('.github/workflows/fieldsight-readme-png-banner.yml')
          if workflow.exists():
              workflow.unlink()
          PY
      - name: Commit banner correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: use PNG logo in README banner'
          git push origin HEAD:hackathon-final-pass
