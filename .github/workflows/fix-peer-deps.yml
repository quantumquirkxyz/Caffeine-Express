name: fix-peer-deps

on:
  push:
    branches: [hackathon-final-pass]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hackathon-final-pass
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx expo install expo-asset react-native-svg
      - name: Commit dependency fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'fix: install required Expo peer dependencies'
          git push origin HEAD:hackathon-final-pass
