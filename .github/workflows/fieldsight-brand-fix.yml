name: fieldsight-brand-fix

on:
  push:
    branches: [hackathon-final-pass]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hackathon-final-pass
          fetch-depth: 0
      - name: Normalize product branding to FieldSight
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git grep -Il -e 'FieldSite' -e 'fieldsite' -e 'FIELDSITE' -- . || true)
          if ((${#files[@]})); then
            python - "${files[@]}" <<'PY'
          from pathlib import Path
          import sys
          for raw in sys.argv[1:]:
              path = Path(raw)
              text = path.read_text(encoding='utf-8')
              updated = (text
                  .replace('FieldSite', 'FieldSight')
                  .replace('fieldsite', 'fieldsight')
                  .replace('FIELDSITE', 'FIELDSIGHT'))
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
          PY
          fi

          if [ -f docs/assets/fieldsite-hero.svg ]; then
            git mv docs/assets/fieldsite-hero.svg docs/assets/fieldsight-hero.svg
          fi

          if git grep -n -I -e 'FieldSite' -e 'fieldsite' -e 'FIELDSITE' -- .; then
            echo 'Residual FieldSite branding remains.' >&2
            exit 1
          fi
      - name: Commit branding correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix: standardize product name as FieldSight'
          git push origin HEAD:hackathon-final-pass
