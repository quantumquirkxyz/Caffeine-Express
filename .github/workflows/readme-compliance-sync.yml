name: readme-compliance-sync

on:
  push:
    branches: [hackathon-final-pass]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hackathon-final-pass
      - name: Make preexisting-base origins explicit
        shell: python
        run: |
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
            '- **quirk Skills workflow bundle**: `.agents/skills/`, `.claude/skills/`, and `skills-lock.json`; development/agent tooling rather than product runtime logic.': '- **quirk Skills workflow bundle**: `.agents/skills/`, `.claude/skills/`, and `skills-lock.json`; preexisting development/agent tooling already present in this repository before the hackathon build window, not product runtime logic. Origin: this repository\'s pre-hackathon Git history.',
            '- **Expo / React Native scaffold and third-party libraries**: Expo, React, React Native/Web, Zod, Lucide, AsyncStorage, `expo-audio`, `expo-asset`, `react-native-svg`, and related configuration.': '- **Expo / React Native scaffold and third-party libraries**: Expo, React, React Native/Web, Zod, Lucide, AsyncStorage, `expo-audio`, `expo-asset`, `react-native-svg`, and related configuration. Origins: their public upstream npm/Open Source projects; versions are pinned in `package.json` / `package-lock.json`.',
            '- **QVAC platform and model artifacts**: official stack used through `@qvac/sdk`, including the configured Llama text model and Parakeet transcription model.': '- **QVAC platform and model artifacts**: official Tether QVAC stack used through `@qvac/sdk`, including the configured Llama text model and Parakeet transcription model. Origin: Tether QVAC SDK/model registry (`qvac.tether.io`).',
            '- **Synthetic challenge workbook**: `docs/hackathon_rules/Dummy_Installed_Base_Hackathon.xlsx`, supplied as challenge seed/reference data.': '- **Synthetic challenge workbook**: `docs/hackathon_rules/Dummy_Installed_Base_Hackathon.xlsx`, supplied by the Philips corporate challenge as seed/reference data. Origin: official hackathon challenge materials.',
            '- **Repository foundations**: prior scaffold/history represented by the repository history, including prior documentation and application foundations.': '- **Repository foundations**: prior scaffold/history already present in `quantumquirkxyz/FieldSight` before the 48-hour build window, including prior documentation and application foundations. Origin: this repository\'s Git history; these foundations are not claimed as newly authored hackathon work.',
          }
          for source, target in replacements.items():
              if source not in text:
                  raise SystemExit(f'Missing expected README declaration: {source}')
              text = text.replace(source, target)
          path.write_text(text, encoding='utf-8')
      - name: Commit README compliance clarification
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: make preexisting-base origins explicit'
          git push origin HEAD:hackathon-final-pass
